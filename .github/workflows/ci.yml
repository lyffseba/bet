name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: test core + protocol
        run: cargo test -p bet-core -p bet-protocol
      - name: clippy (engine crates)
        run: cargo clippy -p bet-core -p bet-protocol -- -D warnings
      - name: build cli
        run: cargo build -p bet-cli --release
      - name: e2e multiplayer
        run: bash scripts/e2e-mp.sh

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install
        run: npm install
      - name: typecheck packages
        run: npm run typecheck
