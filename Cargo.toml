[workspace]
resolver = "2"
members = [
    "crates/bet-core",
    "crates/bet-protocol",
    "crates/bet-cli",
    "crates/bet-wasm",
]
default-members = ["crates/bet-cli"]

[workspace.package]
version = "2.0.0-alpha.0"
edition = "2024"
license = "MIT"
authors = ["lyffseba"]
repository = "https://github.com/lyffseba/bet"

[workspace.dependencies]
bet-core = { path = "crates/bet-core" }
bet-protocol = { path = "crates/bet-protocol" }
crossterm = "0.28"
qrcode = "0.14.1"
rand = "0.8"
ratatui = "0.30.0"
open = "5.1.2"
shakmaty = "0.30.0"
directories = "6.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
